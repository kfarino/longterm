name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  no-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Ensure no household secrets are tracked
        run: npm run check:secrets

  unit-smoke:
    runs-on: ubuntu-latest
    needs: no-secrets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Seed fictional examples
        run: npm run seed
      # data.js is gitignored; dashboard harness tests need the generated bundle.
      - name: Build data.js from seeded examples
        run: npm run build
      # Every data/test-*.mjs suite, not a hand-picked two. The bot and
      # calendar-sync suites went unrun for months, which is how a test
      # asserting that a broken sync should stay silent stayed green.
      - name: Unit tests
        run: npm test
